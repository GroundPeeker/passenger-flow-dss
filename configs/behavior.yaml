# Параметры поведения пешеходов. Единицы — в суффиксах ключей (sim/units.py).

# θ — интенсивность спонтанного обхода затора: люди, ждущие у забитого выхода развилки,
# переходят на другую ветвь к той же станции с интенсивностью θ (доля за шаг 1 − exp(−θ·dt)).
# По умолчанию 0 (решение студента, docs/DECISIONS.md): к забитой ветви ждут, остальные
# проходят. Ненулевые значения — для анализа чувствительности.
detour_rate_per_min: 0.0
