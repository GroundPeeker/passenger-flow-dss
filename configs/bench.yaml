# Эталонная сеть и эпизод для бенчмарка (python -m sim.bench) и проверки детерминизма
# (python -m experiments.check_determinism). Единицы — в суффиксах ключей (sim/units.py).

network:
  generator: grid              # sim.network.grid_network
  rows: 5
  cols: 5                      # 5×5 → 50 рёбер (постановка задачи: цель — 50–80 рёбер)
  seed: 0                      # seed генератора длин, ширин и долей
  # Перегруженная сеть: выпуск 5 × 4 чел/с при стоках 5 × 1.5 чел/с — в эпизоде есть
  # и свободное движение, и заторы с распространением очереди (проверяется узловая модель).
  inflow_ped_per_s: 4.0
  sink_capacity_ped_per_s: 1.5

duration_h: 2                  # постановка задачи: эпизод 1–2 ч модельного времени
repeats: 5                     # повторов замера, берётся медиана
batches: [1, 10, 100]          # размеры пакета (частицы / сценарии MPC)
