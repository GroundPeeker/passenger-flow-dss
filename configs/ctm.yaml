# Параметры пешеходной CTM. Единицы — в суффиксах ключей (sim/units.py), внутри кода СИ.
# Все ключи обязательны.

# Шаг симуляции. Постановка задачи: dt = 5–10 с.
# Условие Куранта: длина ячейки ≥ max(v0, скорость обратной волны)·dt
# (для параметров ниже: max(1.34, 0.47) м/с → ≥ 6.7 м при dt = 5 с); рёбра короче — ошибка.
dt_s: 5.0

fundamental_diagram:
  model: weidmann
  # Weidmann U. Transporttechnik der Fussgänger. Schriftenreihe IVT Nr. 90, ETH Zürich, 1993.
  v0_m_per_s: 1.34          # скорость свободного движения (Weidmann 1993)
  rho_jam_ped_per_m2: 5.4   # плотность затора (Weidmann 1993)
  gamma_per_m2: 1.913       # параметр формы (Weidmann 1993)
  # Дополнительное ограничение пропускной способности на единицу ширины.
  # null — максимум диаграммы: ≈1.225 чел/(м·с) при ρc ≈ 1.75 чел/м².
  q_max_ped_per_m_per_s: null

node_model:
  # false — без FIFO: затор на одном выходе узла задерживает только идущих в него
  # (люди различаются по назначению, обходят очередь на широких площадях).
  # true — FIFO (Daganzo 1995): затор на нужном выходе останавливает весь вход.
  fifo: false

transfer:
  # Мгновенный разворот внутри CTM.transfer_destination (смена станции, когда с ребра нет
  # пути вперёд) разрешён только на рёбрах длиной ≤ max_uturn_cells · c_max · dt
  # (при dt = 5 с и 2 ячейках — ≤ 13.4 м). Рёбра «площадка → вход станции» обязаны
  # укладываться в порог (проверка при создании CTM). Решение студента, docs/DECISIONS.md.
  max_uturn_cells: 2

zones:
  # Плотность ожидания ρ_queue в накопителях (широкие зоны ожидания: площади перед входами,
  # эспланады): вместимость = площадь × ρ_queue. Источник — уровни обслуживания зон ожидания
  # Fruin (1971) по HCM (TRB, 1994), приведены в FHWA-RD-98-107 «Pedestrian Facilities
  # Guidebook», табл. 21: уровень D — 0,27–0,65 м²/чел (1,5–3,7 чел/м²), E — 0,19–0,27,
  # предел (F) — < 0,19 м²/чел (> 5,3 чел/м² ≈ ρ_jam). 3,0 чел/м² (0,33 м²/чел) — плотная
  # очередь уровня D, как у звеньев станции. Диапазон чувствительности 2–4 чел/м²
  # (docs/DECISIONS.md, этап 3а). Раздел необязателен: без него накопители запрещены.
  queue_density_ped_per_m2: 3.0

# Отладочный режим: на каждом шаге проверяются матрица долей (Network.validate_split —
# при переданном split) и инварианты (неотрицательность, ρ ≤ ρ_jam, согласованность
# committed, баланс по назначениям). Медленно; в тестах включается фикстурой (tests/conftest.py).
debug: false
