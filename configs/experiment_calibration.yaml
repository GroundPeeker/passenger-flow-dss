# Калибровка модели планирования (точность model) по «реальности» (точность truth)
# — experiments/calibrate_model.py. Решение студента (до этапа 5): убрать систематическое
# занижение экспозиции моделью (~30 %), причина которого — непрерывный отток с платформы
# вместо дискретных поездов (факторный анализ, DECISIONS.md, этап 4: доработка).
#
# Калибруется один параметр на станцию — множитель κ эффективной пропускной способности
# вывоза в модели (вместимость / интервал · κ). Цель — траектории наблюдаемой величины:
# очереди перед входом каждой станции (люди станции в заторной области перед дверью,
# sim/metrics.py) раз в минуту. Критерий — среднеквадратичное отклонение очереди модели
# от очереди «реальности» на тех же параметрах эпизода, по всем seed, режимам и моментам;
# κ выбирается для каждой станции по своей очереди.
scenario: configs/scenario_stadium.yaml
metrics: configs/metrics.yaml
duration_min: 150
# Seed «реальности» для калибровки и для проверки — не пересекаются с оценочными
# (0–49), планировочными (1000–1009) и друг с другом.
calibration_seeds: {first: 2000, count: 50}
validation_seeds: {first: 3000, count: 50}
# Сетка κ (одинаковый κ у всех станций в одном прогоне; станции слабо связаны —
# выбор κ по очереди каждой станции; совместная проверка — на выбранных κ).
factors: [0.80, 0.81, 0.82, 0.83, 0.84, 0.85, 0.86, 0.87, 0.88, 0.89, 0.90, 0.91, 0.92,
          0.93, 0.94, 0.95, 0.96, 0.97, 0.98, 0.99, 1.00, 1.01, 1.02]
# Режимы управления на калибровочных прогонах: без управления и смена станции A → B
# в 30 % интервалов при c = 1 — чтобы нагрузить станцию B (без управления очереди у B нет
# и κ_B не определяется).
regimes:
  - {name: no_control}
  - {name: switch_f0.3, sign: JN, option: to_B, fraction: 0.3, compliance: 1.0}
# Проверка на отдельных seed: те же режимы и дополнительно правило наименее загруженного
# пути при c = 1 (режим, не участвовавший в калибровке).
validation_extra:
  - {name: least_loaded_c1, compliance: 1.0}
output: configs/calibration_stadium.yaml
