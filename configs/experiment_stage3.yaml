# Этап 3: описание сценария «стадион» без управления (experiments/stage3_scenario.py).
# Результаты — experiments/results/stage3/; по ним строятся рисунки stage3/*.

scenario: configs/scenario_stadium.yaml
metrics: configs/metrics.yaml
# «Реальность» экспериментов: случайный выпуск и дискретные поезда (DECISIONS.md, этап 2а).
fidelity: truth
# Эпизоды: seed 0 … n_seeds − 1, у каждого свой numpy Generator(seed) — параметры эпизода
# (N, профиль выхода, доли) и вся случайность внутри эпизода.
n_seeds: 20
# 2,5 ч после финального свистка: постановка задачи — эпизод 1–2 ч; с запасом, чтобы рассасывание
# при большой явке (N в хвосте логнормального распределения) не обрезалось.
duration_min: 150
# Эпизод для анимации и снимков плотности (по нему записываются плотности ячеек).
animation_seed: 0
# Ключевые участки для графиков плотности (выбор рисунка, не параметр модели): обе ветви
# развилки JN, привокзальная площадь A (накопитель), обход стадиона, подход к шаттлам.
# Этап 3а: эспланада e_n0 заменена обходом e_ns — после введения накопителей заторы
# на эспланаде исчезли, а на обходе остались.
key_edges: [e_av, e_pk, e_sq, e_ns, e_sc]
