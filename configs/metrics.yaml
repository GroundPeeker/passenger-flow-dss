# Параметры метрик (sim/metrics.py). Единицы — в суффиксах ключей (sim/units.py).

# Два набора порогов по типу элемента (решение студента, docs/DECISIONS.md, этапы 3б, 3в;
# зафиксированы до этапа 4): порог затора (вспомогательная метрика «экспозиция затора»)
# и порог опасной плотности ρ_крит (ограничение MPC, перегрузка, главная метрика
# «экспозиция опасной плотности»). ρ_крит выше порога затора.
#
# Порог затора — FHWA-RD-98-107 «Pedestrian Facilities Guidebook» (FHWA, 1998), уровни
# обслуживания HCM (TRB, 1994):
# - улицы (ячейки CTM) — табл. 2 «Existing HCM Walkway LOS Criteria»: уровень F —
#   ≤ 0,6 м²/чел; порог — граница E/F: 1 / 0,6 ≈ 1,667 чел/м² (распад потока; близко
#   к критической плотности Weidmann ρc ≈ 1,75). Ниже диапазона 2–3 чел/м² из постановки задачи;
# - зоны ожидания (накопители) — табл. 21 «Existing HCM Queueing Area LOS Criteria»
#   (по Fruin, 1971): уровень E — 0,19–0,27 м²/чел; порог — граница D/E: 1 / 0,27 ≈
#   3,704 чел/м² (выше ρ_queue = 3,0, configs/ctm.yaml: заполненная зона ожидания уровня D
#   не считается перегрузкой).
congestion_street_ped_per_m2: 1.667
congestion_zone_ped_per_m2: 3.704

# Порог опасной плотности ρ_крит — безопасность толпы:
# - улицы, движущаяся толпа — 4,0 чел/м²: верхняя граница критической плотности движущейся
#   толпы 2–4 чел/м² (G. K. Still, gkstill.com «Moving Crowd Density»: «We observe critical
#   density at 2-4 people per square metre»; выше неё поток падает);
# - зоны ожидания, стоячая толпа — 4,7 чел/м²: максимальная плотность стоячих мест
#   47 чел. на 10 м² (Guide to Safety at Sports Grounds, «Green Guide», SGSA; Still
#   приводит 4,7 и называет 5 чел/м² верхним пределом для стоячих зон, gkstill.com
#   «Standing Crowd Density»).
# Контекст: Helbing, Johansson, Al-Abideen (2007), Phys. Rev. E 75, 046109 — при локальной
# плотности выше 6 чел/м² поток падает в 3 раза и более (локальная плотность с ядром 1 м —
# выше средней по ячейке модели, поэтому как порог не взята).
rho_crit_street_ped_per_m2: 4.0
rho_crit_zone_ped_per_m2: 4.7

# Зона ожидания (накопитель) считается заполненной при n ≥ этой доли вместимости
# (метрика «время заполнения зоны ≥ 95 %», решение студента).
zone_full_fraction: 0.95

# Время рассасывания — пока в районе не останется меньше этой доли зрителей (постановка задачи: 1 %).
clearance_fraction: 0.01

# Очередь у входа станции — люди этой станции в связной области ячеек «в заторе» перед входом
# (ρ > порога). null — критическая плотность диаграммы Weidmann ρc ≈ 1,75 чел/м²: выше неё —
# заторная ветвь, поток ограничен приёмом ниже по течению (определение очереди в CTM).
queue_density_ped_per_m2: null
