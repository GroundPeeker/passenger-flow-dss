# Сценарий «стадион» (этап 3) на синтетической сети networks/stadium.yaml: две станции
# метро (A — у стадиона, B — другой линии), остановка шаттлов C, указатель на развилке JN
# (проспект / парк), камеры. Единицы — в суффиксах ключей (sim/units.py).
#
# Общие механизмы и параметры, не зависящие от сети (шум выпуска, профиль выхода, априор c,
# станция B), — как в configs/scenario_toy.yaml; их обоснования и диапазоны
# чувствительности — там же и в docs/DECISIONS.md (этапы 2а, 2б). Здесь комментируется то,
# что отличается. Все значения, помеченные «оценка», — без источника, входят в реестр
# параметров без источника (docs/DECISIONS.md, этап 3).

network: networks/stadium.yaml
ctm: configs/ctm.yaml
behavior: configs/behavior.yaml

# Шаг управления Δt = 1 мин (как в scenario_toy.yaml; постановка задачи: 1–5 мин).
control_step_min: 1

entrance_levels: [0.0, 0.5, 1.0]

# Точность — как в scenario_toy.yaml (решение студента, DECISIONS.md, этап 2а).
fidelity:
  truth:
    vehicle_model: discrete
    release_noise: {model: overdispersed, cv: 0.3, correlation_time_s: 60}
  model:
    vehicle_model: continuous
    release_noise: {model: multiplicative, cv: 0.2, correlation_time_s: 60}
    # Калибровка эффективной пропускной способности вывоза по «реальности» (решение
    # студента до этапа 5; experiments/calibrate_model.py, DECISIONS.md, этап 4: доработка).
    # Отключается Simulator(calibrated=False) — так планировались схемы этапа 4.
    calibration: configs/calibration_stadium.yaml

closure_awareness: at_door

# --- станции ---------------------------------------------------------------------------
# Удельные пропускные способности — СП 120.13330.2012 «Метрополитены», табл. 5.4
# (контрольный пункт 1200 чел/ч, эскалатор 1,0 м 8200 чел/ч); вместимость зон — площадь ×
# 3 чел/м² (как в scenario_toy.yaml, оценка). Свободные места в поезде 81-717/714 — 20 %
# максимальной вместимости 2596 чел. = 519 чел. (DECISIONS.md, этап 2б).

# Станция A — «стадионная»: рассчитана на повышенный поток (больше турникетов и
# эскалаторов, чем у типовой станции; числа устройств — оценка).
_links_A: &links_A
  # 16 контрольных пунктов × 1200 чел/ч = 19 200 чел/ч = 320 чел/мин; зона ~100 м² × 3
  - {name: turnstiles, storage_ped: 300, capacity_ped_per_h: 19200}
  # 3 эскалатора 1,0 м на спуск × 8200 чел/ч = 24 600 чел/ч = 410 чел/мин; вестибюль ~250 м² × 3
  - {name: escalator, storage_ped: 750, capacity_ped_per_h: 24600}
  # платформа: длина ≈ 162 м (8 вагонов × 19,2 м + 8 м, как в scenario_toy.yaml),
  # полезная ширина в одну сторону 2,5 м → ~400 м² × 3 чел/м²
  - {name: platform, storage_ped: 1200}
_vehicle_A: &vehicle_A
  capacity_ped: 519
  # Во время мероприятий метрополитен работает с уменьшенным интервалом: штатный для
  # сценария — 3 мин (оценка; в scenario_toy — 4 мин вечером), далее 2 мин и 1,5 мин
  # (минимум по СП 120.13330.2012, п. 5.2.1: не более 40 пар поездов в час).
  # Вывоз: 173 → 260 → 346 чел/мин при пропускной способности турникетов 320 чел/мин.
  headway_levels_s: [180, 120, 90]
  min_headway_s: 90
  max_level_changes: 2       # как в scenario_toy.yaml (оценка)
  activation_delay_min: 10   # как в scenario_toy.yaml (оценка)

# Станция B — типовая станция другой линии: звенья и поезда как у тестовой станции
# (configs/scenario_toy.yaml, обоснования там).
_links_B: &links_B
  - {name: turnstiles, storage_ped: 180, capacity_ped_per_h: 12000}   # 10 КПП → 200 чел/мин
  - {name: escalator, storage_ped: 450, capacity_ped_per_h: 16400}    # 2 эскалатора
  - {name: platform, storage_ped: 1200}
_vehicle_B: &vehicle_B
  capacity_ped: 519
  headway_levels_s: [240, 180, 120]   # вывоз 130 → 173 → 260 чел/мин
  min_headway_s: 90
  max_level_changes: 2
  activation_delay_min: 10

# Остановка шаттлов C — огороженный накопитель посадки у южной парковки, одно звено.
_links_C: &links_C
  # накопитель ~250 м² × 3 чел/м² (оценка)
  - {name: boarding, storage_ped: 750}
_vehicle_C: &vehicle_C
  # Автобус ЛиАЗ-5292 — полная вместимость 108 чел. (данные производителя, ЛиАЗ).
  # Шаттлы выделенные, приходят пустыми → 108 мест.
  capacity_ped: 108
  # Штатный интервал 60 с (оценка: ~20 автобусов на кольце ~20 мин), далее 45 и 30 с.
  # Вывоз: 108 → 144 → 216 чел/мин.
  headway_levels_s: [60, 45, 30]
  # Минимальный интервал 30 с: два посадочных места × ~60 с посадки (оценка).
  min_headway_s: 30
  max_level_changes: 2
  # Резервные автобусы — из парка или с соседних маршрутов: 15 мин (оценка).
  activation_delay_min: 15

stations:
  - id: A
    entrances: [MA]
    alternative: MB            # от закрытого входа A — к станции B (связка площадок e_ab)
    direction: metro           # A и B — метро: закрыть обе одновременно нельзя
    links: *links_A
    vehicle: *vehicle_A
  - id: B
    entrances: [MB]
    alternative: MA
    direction: metro
    links: *links_B
    vehicle: *vehicle_B
  - id: C
    entrances: [MC]
    # Альтернатива шаттлам — уйти пешком / на такси (назначение OUT). Станция C —
    # единственная в направлении shuttle, поэтому закрыть её (уровень 0) нельзя,
    # ограничить на 50 % — можно (DECISIONS.md, этап 2б).
    alternative: OUT
    direction: shuttle
    links: *links_C
    vehicle: *vehicle_C

# --- указатели -------------------------------------------------------------------------
# Указатель на северной эспланаде JN: к метро — по проспекту или через парк.
# Привычка (кратчайший путь): к A — по проспекту, к B — через парк.
signs:
  - node: JN
    options:
      - name: avenue            # к метро A и B — по проспекту (к B — через связку площадок)
        route: {MA: e_av, MB: e_av}
      - name: park              # к метро A и B — через парк
        route: {MA: e_pk, MB: e_pk}

# Указатель «смена станции» на JN (этап 4, решение студента; DECISIONS.md, этап 4):
# вариант to_B — «к метро — на станцию B»: доля c людей станции A, проходящих JN
# (северные зрители с эспланады и южные — по обходу), меняет назначение на B и идёт
# к B по своим долям (привычка — через парк и бульвар, 825 м). Это главный рычаг этапа 4:
# узкое место — пропускная способность станции A, а указатель маршрута JN (выше) меняет
# только улицу, по которой идут к той же A. Степень следования — своя у указателя
# (индекс после указателей маршрута), в экспериментах этапа 4 — одна c на всех указателях.
station_signs:
  - node: JN
    options:
      - name: to_B
        switch: {MA: MB}

# --- спрос -----------------------------------------------------------------------------
demand:
  attendance:
    # Ожидаемое число зрителей 30 000 (оценка: стадион на 35–45 тыс. мест, заполнение
    # ~75 %); неопределённость явки — как в scenario_toy.yaml.
    mean_ped: 30000
    cv: 0.15
  # Доли секторов: северный выход (к метро) — 60 %, южный — 40 % (оценка).
  sector_shares: {SN: 0.6, SS: 0.4}
  sector_concentration: 100
  destination_concentration: 50
  # Профиль выхода — как в scenario_toy.yaml (оценка: основная масса выходит за 10–30 мин).
  exit_profile:
    model: gamma
    mean_low_min: 8
    mean_high_min: 16
    shape_low: 2.0
    shape_high: 4.0

compliance:
  distribution: uniform
  low: 0.0
  high: 1.0
  node_sd_logit: 0.0
  drift_sd_logit_per_sqrt_h: 0.0

# --- наблюдения ------------------------------------------------------------------------
# Камеры: обе ветви развилки JN (проспект, аллея парка), аллея JP → PA, привокзальная
# площадь A, бульвар к B, подход к шаттлам. Эспланады и обход стадиона не наблюдаются.
# Этап 4 (решение студента, DECISIONS.md): добавлена камера на площадке перед входом B
# (e_mb) — камеры на площадях у станций реалистичны (как на площади A); без неё очередь
# у B видна только после выхода на бульвар.
observation:
  sensors:
    - {edge: e_av, kind: count}
    - {edge: e_pk, kind: count}
    - {edge: e_pj, kind: count}
    - {edge: e_sq, kind: count}
    - {edge: e_pb, kind: count}
    - {edge: e_sc, kind: count}
    - {edge: e_mb, kind: count}
  noise:
    model: poisson
