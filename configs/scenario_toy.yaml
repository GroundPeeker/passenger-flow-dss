# Сценарий на синтетической тестовой сети networks/toy_fork.yaml: станции, спрос,
# следование рекомендациям, датчики, шаг управления. Единицы — в суффиксах ключей
# (sim/units.py). Пути — от корня репозитория.
#
# Сеть тестовая (этап 2): числа ниже — правдоподобные оценки для проверки модели,
# а не данные конкретного стадиона. Где написано «оценка», значение подлежит уточнению
# при переходе к сети реального стадиона (этап 3 и далее).

network: networks/toy_fork.yaml
ctm: configs/ctm.yaml
behavior: configs/behavior.yaml

# Шаг управления Δt. Постановка задачи: 1–5 мин; 1 мин — нижняя граница (чаще оператор
# не успевает принять решение). Должен быть кратен dt CTM.
control_step_min: 1

# Допустимые уровни входа станции: закрыт / ограничен вдвое / открыт (постановка задачи).
entrance_levels: [0.0, 0.5, 1.0]

# Точность симуляции (решение студента, DECISIONS.md, этап 2а). Аргумент Simulator(fidelity=…).
# truth — «реальность» в экспериментах: случайный выпуск со стадиона + дискретные поезда;
# model — модель фильтра частиц и MPC: непрерывный отток с платформы + шум процесса.
# Модель контроллера намеренно отличается от «реальности» (защита от inverse crime).
fidelity:
  truth:
    vehicle_model: discrete
    # Выход группами (компании зрителей, волны после объявлений): избыточная дисперсия
    # к биномиальному выпуску. cv и период обновления множителя — оценка (источника нет).
    release_noise: {model: overdispersed, cv: 0.3, correlation_time_s: 60}
  model:
    vehicle_model: continuous
    # Шум процесса модели — предварительно; уровень уточняется на этапе 6 (фильтр частиц)
    # и фиксируется до сравнения методов.
    release_noise: {model: multiplicative, cv: 0.2, correlation_time_s: 60}

# Кто и когда узнаёт о закрытии входа (sim/behavior.py, CLOSURE_MODELS):
# at_door — у двери (по умолчанию, решение студента). Если альтернативная станция тоже
# закрыта, люди ждут у двери. Закрыть (уровень 0) все станции одного направления (direction)
# нельзя; ограничение 0.5 доступно любой станции, в том числе единственной в направлении.
closure_awareness: at_door

# Станции тестовой сети — гипотетическая станция мелкого заложения у стадиона.
# Удельные пропускные способности — СП 120.13330.2012 «Метрополитены», табл. 5.4;
# числа турникетов, эскалаторов и площади зон — параметры гипотетической станции
# (оценка), подобраны так, чтобы в типичном сценарии узкие места менялись со временем:
# в пик прихода — турникеты (очередь на улице), затем — вывоз поездами (очередь
# на платформе, после её заполнения — снова на улице), после ввода дополнительных
# поездов — опять турникеты (решение студента, DECISIONS.md, этап 2а).
#
# Вместимость звена = площадь × 3 чел/м². Оценка: верхняя граница диапазона порога
# перегрузки ρ_crit = 2–3 чел/м² (постановка задачи) — станция заполняется до уровня перегрузки,
# после чего вход ограничивают. Нормы Фруина для зон ожидания по первоисточнику
# не проверены — уточнить.
#
# Двери входа — сток сети (networks/toy_fork.yaml): 6 дверных проёмов × 3200 чел/ч
# (СП 120.13330.2012, табл. 5.4, «через дверной проём 0,8 м») = 19 200 чел/ч.
_station_links: &station_links
  # 10 автоматических контрольных пунктов на вход × 1200 чел/ч (СП 120.13330.2012,
  # табл. 5.4) = 12 000 чел/ч = 200 чел/мин; зона перед ними ~60 м² × 3 чел/м²
  - {name: turnstiles, storage_ped: 180, capacity_ped_per_h: 12000}
  # 2 эскалатора на спуск шириной 1,0 м × 8200 чел/ч (СП 120.13330.2012, табл. 5.4)
  # = 16 400 чел/ч ≈ 273 чел/мин; вестибюль ~150 м² × 3 чел/м²
  - {name: escalator, storage_ped: 450, capacity_ped_per_h: 16400}
  # платформа: длина ≈ длине поезда 8 × 19,2 м = 154 м (длина вагона 81-717/714 —
  # 19 206 мм, Википедия «81-717/714») + 8 м; полезная ширина зоны посадки в одну
  # сторону ~2,5 м (оценка) → ~400 м² × 3 чел/м²
  - {name: platform, storage_ped: 1200}
_vehicle: &vehicle
  # Вместимость 8-вагонного состава 81-717/714 при плотности 10 чел/м² (максимальная,
  # с переполнением): 2 × 308 + 6 × 330 = 2596 чел. (vagon.metro.ru, «Электровагоны типов
  # 81-717/714», по книге В. П. Калиничева «Метрополитены»; в Википедии у головного 309).
  # Номинальная по СП 120.13330.2012, п. 5.2.3 (все места для сидения + 4,5 стоящих на м²;
  # стоячая площадь (308 − 40)/10 = 26,8 м² и (330 − 44)/10 = 28,6 м²) — ≈ 1357 чел.
  # Свободно в прибывающем поезде 20 % максимальной вместимости (≈ 38 % номинальной;
  # оценка: поезд приходит загруженным пассажирами линии; источника нет; диапазон
  # чувствительности 15–30 %, DECISIONS.md, этап 2б) → 0,2 × 2596 ≈ 519 чел.
  capacity_ped: 519
  # Штатный вечерний интервал 4 мин (оценка; на малозагруженных линиях Московского
  # метро — 4–5 мин, asmetro.ru, вторичный источник) → 3 мин → 2 мин.
  # Вывоз: 130 → 173 → 260 чел/мин при пропускной способности турникетов 200 чел/мин.
  headway_levels_s: [240, 180, 120]
  # Минимальный интервал — 90 с: пропускная способность линии не более 40 пар поездов
  # в час (СП 120.13330.2012, п. 5.2.1); достигнутый в Москве минимум — 90 с
  # (mos.ru, 19.04.2016).
  min_headway_s: 90
  # Ресурс оперативного резерва — две смены уровня за эпизод (оценка, источника нет).
  max_level_changes: 2
  # Задержка ввода дополнительных поездов: выход резервного состава и включение
  # в график (оценка 10 мин, источника нет; исследуется как параметр).
  activation_delay_min: 10

stations:
  - id: A
    entrances: [M1]
    alternative: M2            # от закрытого входа люди идут к станции B (ближайшая)
    direction: metro           # обе станции — метро: закрыть обе одновременно нельзя
    links: *station_links
    vehicle: *vehicle
  - id: B
    entrances: [M2]
    alternative: M1
    direction: metro
    links: *station_links
    vehicle: *vehicle

# Указатели на развилках. Вариант — {назначение: ребро}; для назначений, которых нет
# в варианте, рекомендация не действует (уходящие из района её игнорируют).
signs:
  - node: J1
    options:
      - name: north             # к метро — через площадку PM1 (e2)
        route: {M1: e2, M2: e2}
      - name: south             # к метро — через J2 и площадку PM2 (e3)
        route: {M1: e3, M2: e3}

demand:
  attendance:
    # ожидаемое число зрителей (оценка: стадион среднего размера, ~20 тыс.; около 40 %
    # идут к каждой из станций — ~8 тыс., 40 мин работы турникетов при 200 чел/мин)
    mean_ped: 20000
    # неопределённость явки относительно проданных билетов (оценка)
    cv: 0.15
  # средние доли секторов — пропорционально потокам источников в toy_fork.yaml (360:180)
  sector_shares: {S1: 0.6667, S2: 0.3333}
  # концентрации Дирихле: чем больше, тем меньше разброс долей (null — без неопределённости);
  # κ = 100 даёт стандартное отклонение доли 0.5 около 0.05 (оценка)
  sector_concentration: 100
  # средние доли направлений — destinations источников в сети; κ = 50 → σ ≈ 0.07 при доле 0.5
  destination_concentration: 50
  # время выхода после финального свистка ~ Гамма; среднее и форма неизвестны и
  # семплируются на эпизод (оценка: основная масса выходит за 10–30 мин)
  exit_profile:
    model: gamma
    mean_low_min: 8
    mean_high_min: 16
    shape_low: 2.0
    shape_high: 4.0

compliance:
  # Степень следования неизвестна: широкий априор на [0, 1]
  # (в работах Mayr & Köster 2022, 2026 исследуется весь диапазон c).
  distribution: uniform
  low: 0.0
  high: 1.0
  # различие c по указателям — смещение на логит-шкале (0 — одна c на все указатели)
  node_sd_logit: 0.0
  # медленный дрейф c — случайное блуждание на логит-шкале, σ за √час (0 — без дрейфа)
  drift_sd_logit_per_sqrt_h: 0.0

observation:
  # Камеры на части рёбер: подход со стадиона, обе ветви развилки J1, подход к площадке PM2.
  sensors:
    - {edge: e1, kind: count}
    - {edge: e2, kind: count}
    - {edge: e3, kind: count}
    - {edge: e5, kind: count}
  # Пуассоновский шум счётчика (оценка; погрешность подсчёта людей по видео растёт с плотностью)
  noise:
    model: poisson
