# Синтетическая сеть «стадион» (этап 3): стадион с двумя выходами, две станции метро
# (A — у стадиона, B — другой линии, дальше), остановка шаттлов C и уход из района.
# К станции A от северного выхода — два альтернативных маршрута: проспект (короткий)
# и парк (длиннее на ~20 %); на развилке JN — указатель. 16 рёбер, из них 5 накопителей
# (zone, помечены [Н]) — широкие зоны ожидания (этап 3а, решение студента).
#
#                         MB                MA
#                          | e_mb [Н]        | e_sq [Н] (привокзальная площадь A)
#                         PB ⇄ e_ab/e_ba ⇄  PA            (связка площадок, 2 × 3 м)
#                          ^               / |
#                    e_pb  |      e_pj    /  |
#                          JP -----------/   | e_av (проспект)
#                     e_pk  \                |
#                            \-------------- JN ---e_e---> OUT_E   (в город, к парковкам)
#                                             | e_n0 [Н] (северная эспланада)
#                     обход стадиона  ⇅       SN
#                     e_ns / e_sn            [стадион]
#                                             SS
#                                             | e_s0 [Н] (южная площадь)
#                                             JS ---e_sc---> PC --e_mc [Н]--> MC (шаттлы)
#                                                             \--e_os--> OUT_S (к парковке)
#
# Накопители (zone: true): одна ячейка, вместимость = площадь × ρ_queue (configs/ctm.yaml),
# плотность = люди / площадь; при заполнении затор переходит на подходящие улицы (CTM).
# Критерий: широкая (≥ 20 м) зона, где люди ждут, а не идут — площади перед входами
# станций и эспланады у выходов со стадиона. Улицы (≤ 10 м) остаются в CTM.
# Накопитель перед входом идёт прямо к дверям: подход к дверям — часть площади.
#
# Геометрия синтетическая (не конкретный стадион): длины и ширины — правдоподобные оценки
# для стадиона на ~30–45 тыс. мест в городской застройке. Сеть заменяется сетью по OSM
# на последующих этапах, поэтому геометрия не входит в реестр параметров чувствительности.
#
# Обоснование масштабов:
# - Стадион ~ 260 × 220 м по внешнему контуру (типично для арен на 35–45 тыс. мест);
#   обход стадиона по периметру от южной площади до северной — ~500 м.
# - Станция A — в ~0,5 км от северного выхода (типичное расстояние «стадион — ближайшая
#   станция» для арен в городской застройке; оценка). Станция B — ~0,8 км через парк.
# - Ширины — полезная (свободная) ширина пешеходного пути, а не улицы целиком:
#   проспект на время выхода зрителей перекрыт для транспорта, но часть ширины занята
#   ограждениями и нарядами полиции (10 м — оценка); парковые аллеи 5–6 м; тротуары 8 м.
# - Встречные рёбра (обход стадиона, связка площадок) — по половине ширины улицы
#   (временное правило до этапа 10, docs/DECISIONS.md, этап 1г).
# - Рёбра «площадка → вход» — накопители (площади перед входами); разворот из накопителя
#   к развилке-площадке разрешён при любой длине (sim/ctm.py).
#
# Доли направлений (destinations) — оценки модального разделения для стадиона
# с метро рядом: ~55 % зрителей — метро (A + B), ~17 % — шаттлы, ~29 % — пешком/авто/такси.
# Северный выход обращён к метро, южный — к парковкам и остановке шаттлов.
# Уточняются по данным реального стадиона (опросы зрителей, данные метрополитена).
#
# Координаты (layout) — только для рисунков (схема в метрах, ось y — на север);
# длины рёбер заданы явно и согласованы со схемой с точностью до округления.
nodes:
  - id: SN
    type: source
    # северный выход: к метро A — большинство (выход обращён к станции)
    destinations: {MA: 0.55, MB: 0.15, MC: 0.05, OUT: 0.25}
  - id: SS
    type: source
    # южный выход: к шаттлам и парковкам
    destinations: {MA: 0.25, MB: 0.05, MC: 0.35, OUT: 0.35}
  - {id: JN, type: junction}             # северная эспланада: развилка с указателем
  - {id: JS, type: junction}             # южная площадь
  - {id: JP, type: junction}             # вход в парк: развилка к A и B
  - {id: PA, type: junction}             # начало привокзальной площади A: слияние проспекта
                                         # и аллеи, ответвление связки к B
  - {id: PB, type: junction}             # площадка перед входом B
  - {id: PC, type: junction}             # площадка перед посадкой на шаттлы
  # Двери вестибюля A: 8 дверных проёмов × 3200 чел/ч (СП 120.13330.2012, табл. 5.4,
  # «через дверной проём 0,8 м») = 25 600 чел/ч. 8 проёмов — оценка для станции,
  # обслуживающей стадион (у тестовой станции toy_fork — 6).
  - {id: MA, type: sink, kind: entrance, capacity_ped_per_h: 25600, buffer_ped: 0}
  # Двери B: 6 проёмов × 3200 чел/ч = 19 200 чел/ч (как у тестовой станции toy_fork).
  - {id: MB, type: sink, kind: entrance, capacity_ped_per_h: 19200, buffer_ped: 0}
  # Вход в огороженный накопитель посадки на шаттлы: проход 4 м в ограждении; пропускная
  # способность по максимуму диаграммы Weidmann 1,225 чел/(м·с) × 4 м ≈ 17 640 чел/ч.
  - {id: MC, type: sink, kind: entrance, capacity_ped_per_h: 17640, buffer_ped: 0}
  # Уход из района (пешком, к парковкам, такси) — без ограничения пропускной способности;
  # два выхода из района с одним назначением OUT.
  - {id: OUT_E, type: sink, kind: exit, destination: OUT}
  - {id: OUT_S, type: sink, kind: exit, destination: OUT}
edges:
  # выходы со стадиона — накопители (широкие предстадионные площади, здесь ждут
  # прохода на улицы): северная эспланада 80 × 40 м, южная площадь 80 × 30 м
  - {id: e_n0, from: SN, to: JN, length_m: 80, width_m: 40, zone: true}
  - {id: e_s0, from: SS, to: JS, length_m: 80, width_m: 30, zone: true}
  # обход стадиона: дорожка 8 м, два направления по 4 м
  - {id: e_ns, from: JS, to: JN, length_m: 500, width_m: 4}
  - {id: e_sn, from: JN, to: JS, length_m: 500, width_m: 4}
  # маршрут 1 к метро A — проспект
  - {id: e_av, from: JN, to: PA, length_m: 450, width_m: 10}
  # маршрут 2 к метро A — через парк (235 + 310 = 545 м против 450 м по проспекту)
  - {id: e_pk, from: JN, to: JP, length_m: 235, width_m: 5}
  - {id: e_pj, from: JP, to: PA, length_m: 310, width_m: 5}
  # бульвар от парка к станции B
  - {id: e_pb, from: JP, to: PB, length_m: 590, width_m: 6}
  # площади перед входами — накопители, ведут прямо к дверям:
  # привокзальная площадь A 60 × 40 м (2400 м²)
  - {id: e_sq, from: PA, to: MA, length_m: 60, width_m: 40, zone: true}
  # площадка перед входом B 30 × 20 м (600 м²; оценка)
  - {id: e_mb, from: PB, to: MB, length_m: 30, width_m: 20, zone: true}
  # площадка у накопителя посадки на шаттлы 40 × 25 м (1000 м², часть парковки; оценка)
  - {id: e_mc, from: PC, to: MC, length_m: 40, width_m: 25, zone: true}
  # связка площадок A ⇄ B: улица 6 м, два направления по 3 м (переход к другой станции
  # при закрытом входе)
  - {id: e_ab, from: PA, to: PB, length_m: 600, width_m: 3}
  - {id: e_ba, from: PB, to: PA, length_m: 600, width_m: 3}
  # уход из района на восток (к парковкам и городу)
  - {id: e_e, from: JN, to: OUT_E, length_m: 300, width_m: 10}
  # к остановке шаттлов (южная парковка) и дальше — к парковке P2 и в город
  - {id: e_sc, from: JS, to: PC, length_m: 200, width_m: 8}
  - {id: e_os, from: PC, to: OUT_S, length_m: 400, width_m: 8}

# Схема для рисунков (в модель не входит): координаты узлов, м; waypoints — изломы рёбер.
layout:
  stadium: {center: [0, 0], width_m: 260, height_m: 200}
  nodes:
    SN: [0, 100]
    SS: [0, -100]
    JN: [0, 180]
    JS: [0, -180]
    JP: [-150, 360]
    PA: [0, 630]
    MA: [0, 690]
    PB: [-590, 710]
    MB: [-620, 716]
    PC: [140, -315]
    MC: [168, -344]
    OUT_E: [300, 180]
    OUT_S: [140, -715]
  # встречные рёбра рисуются со смещением вправо по ходу движения (analysis/netplot.py)
  waypoints:
    e_ns: [[-145, -110], [-145, 110]]
    e_sn: [[-145, 110], [-145, -110]]
