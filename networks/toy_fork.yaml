# Синтетическая тестовая сеть: выход со стадиона, развилка, слияние, два входа в метро
# с площадками перед входами и двунаправленная связка между площадками.
#
#   S1 --e1--> J1 --e2--> PM1 --e2a--> M1 (метро A, вход)
#               |          ⇅ e7 / e8                 (связка площадок, двунаправленная)
#               e3--> J2 --e5--> PM2 --e5a--> M2 (метро B, вход)
#   S2 --e4----------/  \           \--e9--> OUT    (ветвь площадки — уход из района)
#                        \--e6--> OUT (уход из района)
#
# Встречное движение (временное решение до этапа 10, docs/DECISIONS.md):
# - основные улицы выхода (e1–e6) — односторонние на всю ширину улицы;
# - двунаправленные участки — пара встречных рёбер, у каждого половина ширины улицы
#   (связка PM1 ⇄ PM2: улица 6 м → e7 и e8 по 3 м); длины и ширины пары обязаны совпадать.
#
# Единицы — в суффиксах ключей (sim/units.py). Назначение стока — его id.
# Маршруты по умолчанию — кратчайшие пути: J1 → M1 по e2, J1 → M2 и OUT по e3.
# Площадка (PM1, PM2) — развилка перед входом с ветвью к другим назначениям: при закрытии
# входа людям с подхода есть куда уйти (CTM.transfer_destination). Рёбра «площадка → вход»
# короче порога мгновенного разворота (configs/ctm.yaml: transfer.max_uturn_cells).
nodes:
  - id: S1
    type: source
    inflow_ped_per_min: 360          # ≈ 21 600 чел/ч с северной трибуны
    destinations: {M1: 0.6, M2: 0.3, OUT: 0.1}
  - id: S2
    type: source
    inflow_ped_per_min: 180
    destinations: {M2: 0.7, OUT: 0.3}
  - {id: J1, type: junction}
  - {id: J2, type: junction}
  - {id: PM1, type: junction}            # площадка перед входом M1
  - {id: PM2, type: junction}            # площадка перед входом M2
  # Двери входа в метро: 6 дверных проёмов × 3200 чел/ч (СП 120.13330.2012, табл. 5.4,
  # «через дверной проём 0,8 м») = 19 200 чел/ч. Турникеты и далее — звенья станции
  # (configs/scenario_toy.yaml). Было 120 чел/мин (оценка этапа 1) — см. DECISIONS.md, этап 2а.
  - {id: M1, type: sink, kind: entrance, capacity_ped_per_h: 19200, buffer_ped: 0}
  - {id: M2, type: sink, kind: entrance, capacity_ped_per_h: 19200, buffer_ped: 0}
  - {id: OUT, type: sink, kind: exit}    # уход из района — без ограничения
edges:
  # основные улицы выхода — односторонние, полная ширина
  - {id: e1, from: S1, to: J1, length_m: 120, width_m: 8}
  - {id: e2, from: J1, to: PM1, length_m: 180, width_m: 6}
  - {id: e3, from: J1, to: J2, length_m: 250, width_m: 5}
  - {id: e4, from: S2, to: J2, length_m: 150, width_m: 4}
  - {id: e5, from: J2, to: PM2, length_m: 90, width_m: 6}
  - {id: e6, from: J2, to: OUT, length_m: 300, width_m: 10}
  # вход: площадка → турникеты (короче порога мгновенного разворота)
  - {id: e2a, from: PM1, to: M1, length_m: 12, width_m: 6}
  - {id: e5a, from: PM2, to: M2, length_m: 12, width_m: 6}
  # связка площадок: улица шириной 6 м, два направления по 3 м
  - {id: e7, from: PM1, to: PM2, length_m: 200, width_m: 3}
  - {id: e8, from: PM2, to: PM1, length_m: 200, width_m: 3}
  # ветвь площадки PM2 — уход из района (одностороннее)
  - {id: e9, from: PM2, to: OUT, length_m: 220, width_m: 5}
